name: Ozone Data Sync Pipeline

on:
  schedule:
    # 5:30 AM Central (10:30 UTC) — after 06z AQM models finish
    - cron: '30 10 * * *'
    # 11:30 AM Central (16:30 UTC) — after 12z AQM models finish
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: the push step may need to rebase onto a moved main.
          fetch-depth: 0

      # A scheduled run checks out the commit that triggered it, and a *re-run*
      # replays the ORIGINAL commit -- so its data can be hours or days stale.
      # That is not merely wasteful. The forecaster's gap filler rewalks the last
      # 14 days, and an operational row it cannot see in the checked-out history
      # gets rebuilt as a hindcast, silently destroying live-skill evidence.
      # Always build on the current tip of main.
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Building on $(git rev-parse --short HEAD)"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev libcurl4-openssl-dev libssl-dev

      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ hashFiles('.github/workflows/sync-pipeline.yml') }}
          restore-keys: r-packages-

      - name: Install R packages
        run: |
          Rscript -e '
            pkgs <- c("RAQSAPI", "lubridate", "readr", "dplyr", "randomForest",
                       "caret", "httr2", "jsonlite", "purrr", "terra", "tidyr",
                       "ggplot2", "lattice", "Metrics")
            missing <- pkgs[!pkgs %in% installed.packages()[,"Package"]]
            if (length(missing) > 0) install.packages(missing, repos = "https://cloud.r-project.org")
          '

      - name: Verify secrets are set
        env:
          AQS_EMAIL: ${{ secrets.AQS_EMAIL }}
          AQS_KEY: ${{ secrets.AQS_KEY }}
        run: |
          if [ -z "$AQS_EMAIL" ] || [ -z "$AQS_KEY" ]; then
            echo "::error::AQS_EMAIL or AQS_KEY secrets are not set. Go to Settings > Secrets > Actions to add them."
            exit 1
          fi
          echo "Secrets verified (AQS_EMAIL length: ${#AQS_EMAIL}, AQS_KEY length: ${#AQS_KEY})"

      - name: Write R environment file
        env:
          AQS_EMAIL: ${{ secrets.AQS_EMAIL }}
          AQS_KEY: ${{ secrets.AQS_KEY }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: |
          echo "AQS_EMAIL=$AQS_EMAIL" >> $HOME/.Renviron
          echo "AQS_KEY=$AQS_KEY" >> $HOME/.Renviron
          echo "AIRNOW_API_KEY=$AIRNOW_API_KEY" >> $HOME/.Renviron
          cat $HOME/.Renviron | sed 's/=.*/=***/'

      - name: Run pipeline (data sync + train + forecast)
        run: Rscript r-pipeline/run_pipeline.R

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Trained models (*.rds) are deliberately not committed — see .gitignore.
          git add data/ r-pipeline/*.csv
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Scheduled data sync $(date -u '+%Y-%m-%d %H:%M UTC')"

          # The push loses a race whenever another run pushes while this one is
          # working, and GitHub bunches delayed cron runs, so overlaps do happen.
          # All the expensive work is already done by this point, so retry rather
          # than discard the run.
          #
          # Rebase, not merge: this job regenerates data/ and the CSVs in full,
          # so its output belongs on top of whatever is on main. Keep the
          # regenerated copy on conflict -- during a rebase that is "theirs",
          # because git treats the branch being replayed ONTO as "ours".
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase onto origin/main; data not pushed."
              exit 1
            fi
          done
          echo "::error::Push still rejected after 3 attempts."
          exit 1
