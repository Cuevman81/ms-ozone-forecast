name: Ozone Data Sync Pipeline

on:
  schedule:
    # 6:00 AM Central (11:00 UTC)
    - cron: '0 11 * * *'
    # 2:00 PM Central (19:00 UTC) — after 12z AQM models finish
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev libcurl4-openssl-dev libssl-dev

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ hashFiles('.github/workflows/sync-pipeline.yml') }}
          restore-keys: r-packages-

      - name: Install R packages
        run: |
          Rscript -e '
            pkgs <- c("RAQSAPI", "lubridate", "readr", "dplyr", "randomForest",
                       "caret", "httr2", "jsonlite", "purrr", "terra", "tidyr",
                       "ggplot2", "lattice", "Metrics")
            missing <- pkgs[!pkgs %in% installed.packages()[,"Package"]]
            if (length(missing) > 0) install.packages(missing, repos = "https://cloud.r-project.org")
          '

      - name: Set up API credentials
        run: |
          echo "AQS_EMAIL=${{ secrets.AQS_EMAIL }}" >> ~/.Renviron
          echo "AQS_KEY=${{ secrets.AQS_KEY }}" >> ~/.Renviron
          echo "AIRNOW_API_KEY=${{ secrets.AIRNOW_API_KEY }}" >> ~/.Renviron

      - name: Run pipeline (data sync + train + forecast)
        working-directory: r-pipeline
        run: Rscript run_pipeline.R

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ r-pipeline/*.csv r-pipeline/*.rds
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Scheduled data sync $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
