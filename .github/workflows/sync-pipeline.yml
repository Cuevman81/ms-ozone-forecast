name: Ozone Data Sync Pipeline

on:
  schedule:
    # Minute :23 is deliberate. GitHub queues scheduled workflows on shared
    # capacity and the queue is deepest on the hour and at :00/:15/:30, so a
    # popular minute is the first to be delayed or dropped. Delays of 20-60 min
    # are normal and harmless here; whole runs going missing is not.
    #
    # 10:23 UTC — after the 06z AQM models finish
    - cron: '23 10 * * *'
    # 16:23 UTC — after the 12z AQM models finish. This is the authoritative
    # run: it is the last one of the day, so its forecast is the one that ends
    # up logged as the day's operational row.
    - cron: '23 16 * * *'
    # 20:23 UTC — backup only. Skips itself unless BOTH runs above went missing,
    # so it costs nothing on a normal day and never moves the logged forecast to
    # a later issue time. See the "Decide whether to run" job.
    - cron: '23 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Delayed cron runs arrive in a burst once GitHub catches up, which is exactly
# when two of them would otherwise overlap and race on the push. Queue them
# instead. Never cancel in progress: a run that is already training models has
# done the expensive part and its data is worth keeping.
concurrency:
  group: ozone-data-sync
  cancel-in-progress: false

jobs:
  # The 20:23 backup exists only to cover a day when the scheduler dropped both
  # real runs. It must not fire on a normal day: re-forecasting hours later
  # would overwrite the day's operational row with a forecast issued long after
  # Rodney actually submits, quietly flattering the live-skill numbers. Every
  # other trigger runs unconditionally.
  decide:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7

      - name: Decide whether to run
        id: check
        run: |
          if [ "${{ github.event.schedule }}" != "23 20 * * *" ]; then
            echo "Primary trigger (${{ github.event_name }}) — running."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          if TZ=UTC git log -50 --date=format-local:'%Y-%m-%d' --format='%cd %s' \
               | awk -v d="$today" '$1 == d' | grep -q 'Scheduled data sync'; then
            echo "A sync already landed on $today — backup has nothing to cover."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No sync landed on $today; both scheduled runs were dropped. Backup is taking over."
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history: the push step may need to rebase onto a moved main.
          fetch-depth: 0

      # A scheduled run checks out the commit that triggered it, and a *re-run*
      # replays the ORIGINAL commit -- so its data can be hours or days stale.
      # That is not merely wasteful. The forecaster's gap filler rewalks the last
      # 14 days, and an operational row it cannot see in the checked-out history
      # gets rebuilt as a hindcast, silently destroying live-skill evidence.
      # Always build on the current tip of main.
      - name: Sync to latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
          echo "Building on $(git rev-parse --short HEAD)"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev libcurl4-openssl-dev libssl-dev

      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ hashFiles('.github/workflows/sync-pipeline.yml') }}
          restore-keys: r-packages-

      - name: Install R packages
        run: |
          Rscript -e '
            pkgs <- c("RAQSAPI", "lubridate", "readr", "dplyr", "randomForest",
                       "caret", "httr2", "jsonlite", "purrr", "terra", "tidyr",
                       "ggplot2", "lattice", "Metrics")
            missing <- pkgs[!pkgs %in% installed.packages()[,"Package"]]
            if (length(missing) > 0) install.packages(missing, repos = "https://cloud.r-project.org")
          '

      - name: Verify secrets are set
        env:
          AQS_EMAIL: ${{ secrets.AQS_EMAIL }}
          AQS_KEY: ${{ secrets.AQS_KEY }}
        run: |
          if [ -z "$AQS_EMAIL" ] || [ -z "$AQS_KEY" ]; then
            echo "::error::AQS_EMAIL or AQS_KEY secrets are not set. Go to Settings > Secrets > Actions to add them."
            exit 1
          fi
          echo "Secrets verified (AQS_EMAIL length: ${#AQS_EMAIL}, AQS_KEY length: ${#AQS_KEY})"

      - name: Write R environment file
        env:
          AQS_EMAIL: ${{ secrets.AQS_EMAIL }}
          AQS_KEY: ${{ secrets.AQS_KEY }}
          AIRNOW_API_KEY: ${{ secrets.AIRNOW_API_KEY }}
        run: |
          echo "AQS_EMAIL=$AQS_EMAIL" >> $HOME/.Renviron
          echo "AQS_KEY=$AQS_KEY" >> $HOME/.Renviron
          echo "AIRNOW_API_KEY=$AIRNOW_API_KEY" >> $HOME/.Renviron
          cat $HOME/.Renviron | sed 's/=.*/=***/'

      - name: Run pipeline (data sync + train + forecast)
        run: Rscript r-pipeline/run_pipeline.R

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Trained models (*.rds) are deliberately not committed — see .gitignore.
          git add data/ r-pipeline/*.csv
          if git diff --staged --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "Scheduled data sync $(date -u '+%Y-%m-%d %H:%M UTC')"

          # The push loses a race whenever another run pushes while this one is
          # working, and GitHub bunches delayed cron runs, so overlaps do happen.
          # All the expensive work is already done by this point, so retry rather
          # than discard the run.
          #
          # Rebase, not merge: this job regenerates data/ and the CSVs in full,
          # so its output belongs on top of whatever is on main. Keep the
          # regenerated copy on conflict -- during a rebase that is "theirs",
          # because git treats the branch being replayed ONTO as "ours".
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto origin/main."
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::Could not rebase onto origin/main; data not pushed."
              exit 1
            fi
          done
          echo "::error::Push still rejected after 3 attempts."
          exit 1
